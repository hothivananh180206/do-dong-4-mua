# ============================================================
# nginx/nginx.conf – Reverse Proxy cho Đổ Đống 4 Mùa
# Thay YOUR_DOMAIN bằng tên miền thực của bạn (vd: dodong4mua.duckdns.org)
# ============================================================

events {
    worker_connections 1024;
}

http {
    # Cho phép upload file lên đến 10MB
    client_max_body_size 10M;

    # Gzip để tăng tốc tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── HTTP (cổng 80) ──────────────────────────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;

        # Certbot xác minh domain để cấp SSL
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Chuyển tất cả HTTP → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (cổng 443) ────────────────────────────────────
    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN www.YOUR_DOMAIN;

        # Chứng chỉ SSL (Certbot tự tạo)
        ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Cho phép upload file lên đến 10MB
        client_max_body_size 10M;

        # Chuyển request → Next.js app (cổng 3000)
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
